name: Push CI
permissions:
  contents: write
on:
  push:
    branches: [main]
    tags:
      - "v*"

jobs:
  lint_and_fast_tests:
    name: "Run CLI tests"
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [14.x, 15.x, 16.x, 17.x, 18.x, current]
    steps:
      # Basic setup
      - uses: actions/checkout@v3
        with:
          clean: "false"
          fetch-depth: 0
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v3
        with:
          node-version: ${{ matrix.node-version }}
      - name: Install
        run: yarn install --immutable
      - name: Build
        run: yarn turbo run build
      - name: Setup git
        run: git config --global user.email "test@gmail.com" && git config --global user.name "test"
      - name: Git Version
        run: git --version
      - name: Test
        run: yarn workspace @danerwilliams/charcoal run test

  superlinter:
    name: "Run superlinter"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3
        with:
          # Full git history is needed to get a proper list of changed files within `super-linter`
          fetch-depth: 0

      - name: Lint Code Base
        uses: github/super-linter@v4
        continue-on-error: true
        env:
          VALIDATE_ALL_CODEBASE: false
          DEFAULT_BRANCH: main
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TYPESCRIPT_DEFAULT_STYLE: prettier

  create-binaries:
    name: Upload executable binaries
    strategy:
      matrix:
        include:
          - runner: macos-latest
            target: node18-macos-x64
            name: ch-macos-x64
          - runner: macos-latest
            target: node18-macos-arm64
            name: ch-macos-arm64
          - runner: ubuntu-latest
            target: node18-linux
            name: ch-linux
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      - name: Setup node
        uses: actions/setup-node@v3
        with:
          node-version: 16
      - name: Install
        run: yarn install --immutable
      - name: Build
        run: yarn turbo run build
      - name: Build binary
        run: yarn workspace @danerwilliams/charcoal run build-pkg -t ${{ matrix.target }} -o "${{ matrix.name }}-${{ github.sha }}"
      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}-${{ github.sha }}
          path: apps/cli/${{ matrix.name }}-${{ github.sha }}

  release:
    name: Release version
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [lint_and_fast_tests, create-binaries]
    runs-on: ubuntu-latest
    steps:
      - name: Download macOS arm64
        uses: actions/download-artifact@v4
        with:
          name: ch-macos-arm64-${{ github.sha }}
      - name: Download macOS x64
        uses: actions/download-artifact@v4
        with:
          name: ch-macos-x64-${{ github.sha }}
      - name: Download Linux
        uses: actions/download-artifact@v4
        with:
          name: ch-linux-${{ github.sha }}
      - name: Rename files
        run: |
          mv ch-macos-arm64-${{ github.sha }} ch-macos-arm64;
          mv ch-macos-x64-${{ github.sha }} ch-macos-x64;
          mv ch-linux-${{ github.sha }} ch-linux
      - name: Release
        uses: ncipollo/release-action@v1
        with:
          artifacts: "ch-macos-arm64,ch-macos-x64,ch-linux"
          draft: false
          prerelease: false
          allowUpdates: true
