name: Push CI
permissions:
  contents: write
on:
  push:
    branches: [main]
    tags:
      - "v*"

jobs:
  lint_and_fast_tests:
    name: "Run CLI tests"
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [14.x, 15.x, 16.x, 17.x, 18.x, current]
    steps:
      # Basic setup
      - uses: actions/checkout@v3
        with:
          clean: "false"
          fetch-depth: 0
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v3
        with:
          node-version: ${{ matrix.node-version }}
      - name: Install
        run: yarn install --immutable
      - name: Build
        run: yarn turbo run build
      - name: Setup git
        run: git config --global user.email "test@gmail.com" && git config --global user.name "test"
      - name: Git Version
        run: git --version
      - name: Test
        run: yarn workspace @danerwilliams/charcoal run test

  superlinter:
    name: "Run superlinter"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3
        with:
          # Full git history is needed to get a proper list of changed files within `super-linter`
          fetch-depth: 0

      - name: Lint Code Base
        uses: github/super-linter@v4
        continue-on-error: true
        env:
          VALIDATE_ALL_CODEBASE: false
          DEFAULT_BRANCH: main
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TYPESCRIPT_DEFAULT_STYLE: prettier

  create-binaries:
    name: Build release binaries
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      - name: Setup node
        uses: actions/setup-node@v3
        with:
          node-version: 18
      - name: Setup bun
        uses: oven-sh/setup-bun@v2
      - name: Install
        run: yarn install --immutable
      - name: Build
        run: yarn turbo run build
      # Bun cross-compiles every target from this single Linux runner.
      - name: Build binaries
        working-directory: apps/cli
        run: |
          bun build --compile --target=bun-darwin-arm64 ./dist/src/index.js --outfile ch-macos-arm64
          bun build --compile --target=bun-darwin-x64 ./dist/src/index.js --outfile ch-macos-x64
          bun build --compile --target=bun-linux-x64 ./dist/src/index.js --outfile ch-linux
      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: ch-binaries-${{ github.sha }}
          path: |
            apps/cli/ch-macos-arm64
            apps/cli/ch-macos-x64
            apps/cli/ch-linux

  release:
    name: Release version
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [lint_and_fast_tests, create-binaries]
    runs-on: ubuntu-latest
    steps:
      - name: Download binaries
        uses: actions/download-artifact@v4
        with:
          name: ch-binaries-${{ github.sha }}
      - name: Release
        uses: ncipollo/release-action@v1
        with:
          artifacts: "ch-macos-arm64,ch-macos-x64,ch-linux"
          draft: false
          prerelease: false
          allowUpdates: true
